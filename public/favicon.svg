<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Mirrors the in-app LogoMark: a pixel grid (source image) resolving into a
       vector path with anchor nodes. Presentation attributes are the fallback
       for renderers that strip/ignore <style> (some image pipelines, feed
       readers); the CSS overrides them for light/dark theme adaptation where
       styles are evaluated, matching the app's accent. -->
  <style>
    .fill { fill: #0e8f86; }
    .line { fill: none; stroke: #0e8f86; stroke-width: 2; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .fill { fill: #34c9bb; }
      .line { stroke: #34c9bb; }
    }
  </style>
  <rect class="fill" fill="#0e8f86" x="4" y="13" width="6.6" height="6.6" rx="1.4" />
  <rect class="fill" fill="#0e8f86" x="4" y="21" width="6.6" height="6.6" rx="1.4" />
  <rect class="fill" fill="#0e8f86" x="12" y="21" width="6.6" height="6.6" rx="1.4" opacity="0.5" />
  <path class="line" fill="none" stroke="#0e8f86" stroke-width="2" stroke-linecap="round" d="M13 16 C 23 14, 25 27, 33 26" />
  <circle class="fill" fill="#0e8f86" cx="13" cy="16" r="2.7" />
  <circle class="fill" fill="#0e8f86" cx="33" cy="26" r="2.7" />
</svg>
