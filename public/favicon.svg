<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Mirrors the in-app LogoMark: a Bézier curve between two square anchor
       handles (the pen-tool gesture of vector editing). Presentation attributes
       are the fallback for renderers that strip/ignore <style> (some image
       pipelines, feed readers); the CSS overrides them for light/dark theme
       adaptation where styles are evaluated, matching the app's accent. -->
  <style>
    .fill { fill: #0e8f86; }
    .line { fill: none; stroke: #0e8f86; stroke-width: 2.4; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .fill { fill: #34c9bb; }
      .line { stroke: #34c9bb; }
    }
  </style>
  <path class="line" fill="none" stroke="#0e8f86" stroke-width="2.4" stroke-linecap="round" d="M9 27 C 21 27, 13 13, 31 13" />
  <rect class="fill" fill="#0e8f86" x="5.5" y="23.5" width="7" height="7" rx="1.3" />
  <rect class="fill" fill="#0e8f86" x="27.5" y="9.5" width="7" height="7" rx="1.3" />
</svg>
